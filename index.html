<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>RuleCheck</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,560;9..144,700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <style>
      :root {
        --ink: #17211c;
        --paper: #f3ecdf;
        --moss: #1f4d3a;
        --leaf: #d6f25c;
        --clay: #c4492c;
        --line: #2a2118;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        color: var(--paper);
        background:
          radial-gradient(circle at 12% 18%, #315c48 0 18%, transparent 19%),
          linear-gradient(145deg, #101915 0%, #24382d 48%, #101915 100%);
        font-family: "IBM Plex Mono", ui-monospace, monospace;
      }
      body::before {
        content: "";
        position: fixed;
        inset: 18px;
        border: 1px solid rgba(243, 236, 223, 0.28);
        pointer-events: none;
      }
      .shell {
        display: grid;
        grid-template-columns: 0.85fr 1.15fr;
        gap: 2.5rem;
        max-width: 68rem;
        margin: 0 auto;
        padding: 3.2rem 2.2rem 4rem;
      }
      .mast h1 {
        margin: 0.4rem 0 0.8rem;
        font-family: Fraunces, Georgia, serif;
        font-size: clamp(4.2rem, 8vw, 7rem);
        font-weight: 560;
        letter-spacing: -0.06em;
        line-height: 0.82;
      }
      .kicker {
        margin: 0;
        color: var(--leaf);
        font-size: 0.72rem;
        letter-spacing: 0.22em;
        text-transform: uppercase;
      }
      .lede {
        max-width: 22rem;
        color: #d9d3c6;
        font-size: 0.92rem;
        line-height: 1.55;
      }
      .stamp {
        display: inline-block;
        margin-top: 1.6rem;
        padding: 0.45rem 0.7rem;
        border: 2px dashed var(--clay);
        color: #ffb2a2;
        font-size: 0.72rem;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        transform: rotate(-2deg);
      }
      .desk {
        background: var(--paper);
        color: var(--ink);
        padding: 1.4rem 1.3rem 1.2rem;
        border-radius: 1.6rem 0.35rem 1.2rem 0.35rem;
        box-shadow: 0.7rem 0.7rem 0 #d6f25c;
      }
      label {
        display: block;
        margin: 0.95rem 0 0.28rem;
        font-size: 0.68rem;
        letter-spacing: 0.16em;
        text-transform: uppercase;
      }
      input, textarea {
        width: 100%;
        border: 0;
        border-bottom: 2px solid var(--line);
        background: transparent;
        color: inherit;
        font: inherit;
        padding: 0.35rem 0 0.5rem;
      }
      textarea { min-height: 4.2rem; resize: vertical; }
      input:focus, textarea:focus { outline: 3px solid var(--leaf); outline-offset: 3px; }
      .actions {
        display: grid;
        grid-template-columns: 8.5rem 1fr;
        gap: 0.7rem;
        margin-top: 1.3rem;
      }
      button {
        border: 0;
        cursor: pointer;
        font: inherit;
      }
      #connect, #read {
        height: 2.4rem;
        background: transparent;
        color: var(--moss);
        border: 1.5px solid var(--moss);
        border-radius: 999px;
        font-size: 0.72rem;
        letter-spacing: 0.04em;
      }
      #read { border-radius: 0.2rem; background: #efe6d4; }
      #submit {
        grid-column: 1 / -1;
        height: 3.4rem;
        background: var(--ink);
        color: var(--leaf);
        border-radius: 0.2rem 1.4rem 0.2rem 0.2rem;
        font-family: Fraunces, Georgia, serif;
        font-size: 1.35rem;
        letter-spacing: -0.03em;
      }
      #wallet, #status, #error, #result { margin: 0.8rem 0 0; }
      #wallet { font-size: 0.75rem; color: #5c5348; word-break: break-all; }
      #status {
        display: inline-block;
        margin-top: 0.9rem;
        padding: 0.2rem 0.45rem;
        background: var(--leaf);
        color: var(--ink);
        font-size: 0.72rem;
      }
      #error { color: var(--clay); font-size: 0.82rem; }
      #result {
        margin-top: 0.7rem;
        padding: 0.8rem 0.2rem 0.2rem;
        border-top: 1px solid #c9bfae;
        white-space: pre-wrap;
        word-break: break-word;
        font-size: 0.84rem;
        line-height: 1.45;
      }
      @media (max-width: 800px) {
        body::before { inset: 8px; }
        .shell { grid-template-columns: 1fr; padding: 1.6rem 1rem 2.4rem; gap: 1.2rem; }
        .mast h1 { font-size: 4.2rem; }
        .desk { box-shadow: 0.35rem 0.35rem 0 #d6f25c; }
      }
    </style>
  </head>
  <body>
    <div class="shell">
      <header class="mast">
        <p class="kicker">Studionet evidence desk</p>
        <h1>Rule<br />Check</h1>
        <p class="lede">One rule. One public page. The contract reads the page and returns PASS, FAIL, or INCONCLUSIVE.</p>
        <div class="stamp">Not a claim form</div>
      </header>
      <section class="desk">
        <label for="address">Contract</label>
        <input id="address" value="0x841Dc93f665AD1fe32A1d026dFcD250ed1515a13" autocomplete="off" />
        <label for="rule">Rule</label>
        <textarea id="rule" maxlength="500" placeholder="The page says this domain is for use in documentation examples."></textarea>
        <label for="url">Evidence URL</label>
        <input id="url" type="url" maxlength="400" placeholder="https://example.com/" />
        <div class="actions">
          <button id="connect" type="button">Connect</button>
          <button id="read" type="button">Saved result</button>
          <button id="submit" type="button">Run the check</button>
        </div>
        <p id="wallet"></p>
        <p id="status">idle</p>
        <p id="error"></p>
        <pre id="result"></pre>
      </section>
    </div>
    <script type="module" src="/main.js"></script>
  </body>
</html>
